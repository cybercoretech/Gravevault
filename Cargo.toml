[package]
name = "gravevault"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Backups you've proven you can restore: append-only git mirrors, encrypted snapshots, restore drills"
license = "MIT"
repository = "https://github.com/cybercoretech/gravevault"
keywords = ["backup", "git", "mirror", "restore", "self-hosted"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
